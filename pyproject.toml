[project]
name = "mlusd"
version = "0.1.0"
description = "Multi-Layer Unified Signal Detection for Ethereum transaction anomaly detection (研究内容二)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
chain = ["web3>=6.0"]
learn = ["torch>=2.0", "torch-geometric>=2.4"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
